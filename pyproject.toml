[project]
name = "subextract"
version = "1.0.0"
description = "从视频提取字幕：导出内嵌字幕轨，或用 Whisper 语音识别"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1,<2",
    "av>=14,<16",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
]

[project.scripts]
subextract = "subtitler.cli:main"
subextract-gui = "subtitler.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subtitler"]
